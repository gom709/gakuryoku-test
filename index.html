<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大人の小中学力テスト</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
<header><h1>大人の小中学力テスト</h1><p>小学生〜中学2年生範囲・全110問</p></header>

<section id="start" class="card">
<h2>受験者登録</h2>
<p>名前を入力してください。ランキング表示に使用します。</p>
<input id="name" maxlength="20" placeholder="ニックネーム（20文字まで）">
<button id="startBtn">テストを開始</button>
<p class="note">※各教科は個別制限時間です。時間切れになると自動提出されます。</p>
</section>

<section id="quiz" class="hidden">
<div class="topbar">
<div><b id="subjectTitle"></b> <span id="progress"></span></div>
<div class="timer" id="timer">10:00</div>
</div>
<div id="questions"></div>
<div class="actions"><button id="submitBtn">この教科を提出</button></div>
</section>

<section id="result" class="hidden card">
<h2>結果発表 🎓</h2>
<div id="summary"></div>
<div class="chartbox"><canvas id="radar"></canvas></div>
<h3>110問の正答一覧</h3>
<div id="answerReview"></div>
<h3>ランキング</h3>
<div id="ranking"></div>
<button id="retryBtn">もう一度受験する</button>
</section>
</div>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
