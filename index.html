const SUBJECTS = ["英語","算数","国語","社会","理科","音楽","美術"], TIME_LIMIT=360;
const state={name:"",subjectIndex:0,answers:{},results:{},score:0,timer:null,endAt:0,submitted:false};
const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), qs=s=>QUESTION_BANK[s]||[];
function startTest(){const name=$("name").value.trim();if(!name){alert("名前を入力してください。");$("name").focus();return}for(const s of SUBJECTS){if(qs(s).length===0){alert(s+"の問題データがありません。");return}if(qs(s).some(q=>!q.q||!Array.isArray(q.options)||q.options.length!==4||!Number.isInteger(q.answer)||q.answer<0||q.answer>3)){alert(s+"の問題データに不備があります。");return}}state.name=name.slice(0,40);state.subjectIndex=0;state.answers={};state.results={};state.score=0;showSubject()}
function showSubject(){clearInterval(state.timer);state.submitted=false;const s=SUBJECTS[state.subjectIndex],a=qs(s);$("startScreen").classList.add("hidden");$("resultScreen").classList.add("hidden");$("testScreen").classList.remove("hidden");$("subjectTitle").textContent=s+" "+(state.subjectIndex+1)+"/"+SUBJECTS.length;$("progressText").textContent=a.length+"問 / 制限時間6分";$("quizForm").innerHTML=a.map((q,i)=>'<article class="question-card"><div class="question-number">第'+(i+1)+'問</div><div class="question-text">'+esc(q.q)+'</div>'+q.options.map((o,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+esc(o)+'</span></label>').join("")+'</article>').join("");$("submitButton").disabled=false;state.endAt=Date.now()+TIME_LIMIT*1000;updateTimer();state.timer=setInterval(updateTimer,250);scrollTo(0,0)}
function updateTimer(){const left=Math.max(0,state.endAt-Date.now()),sec=Math.ceil(left/1000);$("timer").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");if(left<=0){clearInterval(state.timer);submitSubject(true)}}
function submitSubject(auto){if(state.submitted)return;state.submitted=true;clearInterval(state.timer);$("submitButton").disabled=true;const s=SUBJECTS[state.subjectIndex],a=qs(s),picked={};let correct=0;a.forEach((q,i)=>{const el=document.querySelector('input[name="q'+i+'"]:checked');picked[i]=el?Number(el.value):null;if(picked[i]===q.answer)correct++});state.answers[s]=picked;state.results[s]={correct:correct,total:a.length,percent:Math.round(correct/a.length*100)};state.score+=correct;if(auto)alert(s+"の制限時間が終了しました。自動的に採点します。");if(state.subjectIndex<SUBJECTS.length-1){state.subjectIndex++;showSubject()}else showResults()}
function showResults(){clearInterval(state.timer);$("testScreen").classList.add("hidden");$("resultScreen").classList.remove("hidden");$("resultName").textContent=state.name;$("totalScore").textContent=state.score+" / 120";$("resultTable").innerHTML=SUBJECTS.map(s=>{const r=state.results[s];return "<tr><td>"+esc(s)+"</td><td>"+r.correct+"/"+r.total+"</td><td>"+r.percent+"%</td></tr>"}).join("");$("reviewArea").innerHTML=SUBJECTS.map(s=>'<section class="review-section"><h3>'+esc(s)+"</h3>"+qs(s).map((q,i)=>{const a=state.answers[s][i],ok=a===q.answer;return '<div class="review-item '+(ok?"correct":"wrong")+'"><strong>第'+(i+1)+'問 '+(ok?"○ 正解":"× 不正解")+'</strong><div>'+esc(q.q)+'</div><div>あなたの回答：'+(a==null?"未回答":esc(q.options[a]))+'</div><div>正解：'+esc(q.options[q.answer])+"</div></div>"}).join("")+"</section>").join("");scrollTo(0,0)}
async function shareResult(){const text="大人の小中学力テスト
"+state.name+"："+state.score+"/120点
"+SUBJECTS.map(s=>s+" "+state.results[s].percent+"%").join(" / ");if(navigator.share){try{await navigator.share({title:"大人の小中学力テスト 結果",text});return}catch(e){}}try{await navigator.clipboard.writeText(text);alert("結果をコピーしました。SNSへ貼り付けてください。")}catch(e){prompt("以下をコピーしてください。",text)}}
$("startButton").addEventListener("click",startTest);$("submitButton").addEventListener("click",()=>submitSubject(false));$("shareButton").addEventListener("click",shareResult);$("printButton").addEventListener("click",()=>print());$("restartButton").addEventListener("click",()=>location.reload());$("name").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();startTest()}});
</script></body></html>
